apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-secrets
  namespace: nextcloud
type: Opaque
stringData:
  # IMPORTANT: Replace these values before deploying
  postgres-password: "CHANGE_ME_POSTGRES_PASSWORD"
  nextcloud-admin-user: "admin"
  nextcloud-admin-password: "CHANGE_ME_ADMIN_PASSWORD"
  redis-password: "CHANGE_ME_REDIS_PASSWORD"
