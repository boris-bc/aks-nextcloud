apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - pvc.yaml
  - mysql-statefulset.yaml
  - redis.yaml
  - nextcloud-deployment.yaml
  - nextcloud-service.yaml
  # Note: ingress.yaml is excluded from base - add it in overlays with environment-specific domain

commonLabels:
  app.kubernetes.io/name: nextcloud
  app.kubernetes.io/managed-by: kustomize
