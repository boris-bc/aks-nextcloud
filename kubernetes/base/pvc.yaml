    - dir_mode=0770
    - file_mode=0660
    - uid=33  # www-data user
    - gid=33  # www-data group
    - mfsymlinks
    - cache=strict
    - actimeo=30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-config
