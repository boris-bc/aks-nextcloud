# PersistentVolume for Nextcloud user data
# Only stores user files, not application code (for fast initialization)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azurefile
  azureFile:
    secretName: azure-storage
    shareName: nextcloud-data
    readOnly: false
  mountOptions:
    - dir_mode=0770
    - file_mode=0660
    - uid=33  # www-data user
    - gid=33  # www-data group
    - mfsymlinks
    - cache=strict
    - actimeo=30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile
  resources:
    requests:
      storage: 100Gi
  volumeName: nextcloud-data-pv
---
# PersistentVolume for Nextcloud config
# Stores config.php and other configuration files for multi-pod consistency
