apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  replicas: 1  # Start with 1 replica to avoid concurrent initialization conflicts
  selector:
    matchLabels:
      app: nextcloud
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      initContainers:
      - name: configure-trusted-domains
        image: nextcloud:28-apache
        command:
        - sh
        - -c
        - |
          # Wait for config.php to exist (created during first boot)
          echo "Waiting for config.php to be created..."
          for i in $(seq 1 60); do
            if [ -f /var/www/html/config/config.php ]; then
              echo "config.php found, updating trusted domains..."
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          
          # Add trusted domains using occ command (idempotent - won't duplicate)
          if [ -f /var/www/html/config/config.php ]; then
            su -s /bin/sh www-data -c "php /var/www/html/occ config:system:set trusted_domains 1 --value='*.azurewebsites.net'"
            su -s /bin/sh www-data -c "php /var/www/html/occ config:system:set trusted_domains 2 --value='*.westeurope.cloudapp.azure.com'"
            su -s /bin/sh www-data -c "php /var/www/html/occ config:system:set trusted_domains 3 --value='nextcloud.example.com'"
            echo "Trusted domains configured successfully"
          else
            echo "config.php not found, skipping (will be configured on first boot)"
          fi
        volumeMounts:
        - name: nextcloud-config
          mountPath: /var/www/html/config
      containers:
      - name: nextcloud
        image: nextcloud:28-apache
        ports:
        - containerPort: 80
          name: http
        env:
        - name: MYSQL_HOST
          valueFrom:
            secretKeyRef:
              name: nextcloud-db
              key: db-host
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: nextcloud-db
              key: db-name
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: nextcloud-db
              key: db-username
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-db
              key: db-password
        - name: NEXTCLOUD_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: nextcloud-admin
              key: admin-username
        - name: NEXTCLOUD_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-admin
              key: admin-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: nextcloud-config
              key: REDIS_HOST
        - name: REDIS_HOST_PORT
          valueFrom:
            configMapKeyRef:
              name: nextcloud-config
              key: REDIS_HOST_PORT
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          valueFrom:
            configMapKeyRef:
              name: nextcloud-config
              key: NEXTCLOUD_TRUSTED_DOMAINS
        - name: PHP_MEMORY_LIMIT
          valueFrom:
            configMapKeyRef:
              name: nextcloud-config
              key: PHP_MEMORY_LIMIT
        - name: PHP_UPLOAD_LIMIT
          valueFrom:
            configMapKeyRef:
              name: nextcloud-config
              key: PHP_UPLOAD_LIMIT
        volumeMounts:
        - name: nextcloud-data
          mountPath: /var/www/html/data  # Only mount user data directory, not entire app
        - name: nextcloud-config
          mountPath: /var/www/html/config  # Mount config directory for multi-pod consistency
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /status.php
            port: 80
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60  # 60 failures × 10 sec = 600 sec (10 minutes) - sufficient with optimized storage
        livenessProbe:
          httpGet:
            path: /status.php
            port: 80
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /status.php
            port: 80
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: nextcloud-data
        persistentVolumeClaim:
          claimName: nextcloud-data
      - name: nextcloud-config
        persistentVolumeClaim:
          claimName: nextcloud-config
