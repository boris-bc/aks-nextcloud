# WARNING: This file contains PLACEHOLDER values that MUST be replaced before deployment!
# DO NOT deploy this file directly. Use the deployment script or manually create secrets.
# 
# Recommended approach:
# 1. Use the automated deployment script (scripts/deploy.sh)
# 2. Or use kubectl create secret with values from Terraform outputs
#
# Example:
# kubectl create secret generic nextcloud-db --namespace=nextcloud \
#   --from-literal=db-host="<from terraform output>" \
#   --from-literal=db-name="nextcloud" \
#   --from-literal=db-username="nextcloudadmin" \
#   --from-literal=db-password="<from terraform output>"

apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-db
  namespace: nextcloud
type: Opaque
stringData:
  db-host: "mysql"  # MySQL StatefulSet service name
  db-name: "nextcloud"
  db-username: "nextcloud"
  db-password: "REPLACE_WITH_MYSQL_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
type: Opaque
stringData:
  admin-username: "admin"
  admin-password: "REPLACE_WITH_SECURE_PASSWORD"  # Generate with: openssl rand -base64 32
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage
  namespace: nextcloud
type: Opaque
stringData:
  azurestorageaccountname: "REPLACE_WITH_STORAGE_ACCOUNT_NAME"
  azurestorageaccountkey: "REPLACE_WITH_STORAGE_ACCOUNT_KEY"
