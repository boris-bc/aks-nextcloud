apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-db
  namespace: nextcloud
type: Opaque
stringData:
  db-host: "POSTGRES_FQDN"  # Replace with actual value from Terraform output
  db-name: "nextcloud"
  db-username: "nextcloudadmin"
  db-password: "POSTGRES_PASSWORD"  # Replace with actual value from Terraform output
---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
type: Opaque
stringData:
  admin-username: "admin"
  admin-password: "ChangeMe123!"  # Change this in production
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage
  namespace: nextcloud
type: Opaque
stringData:
  azurestorageaccountname: "STORAGE_ACCOUNT_NAME"  # Replace with actual value from Terraform output
  azurestorageaccountkey: "STORAGE_ACCOUNT_KEY"    # Replace with actual value from Terraform output
