apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-config
  namespace: nextcloud
data:
  POSTGRES_DB: "nextcloud"
  NEXTCLOUD_TRUSTED_DOMAINS: "*.azurewebsites.net nextcloud.example.com"
  NEXTCLOUD_ADMIN_USER: "admin"
  REDIS_HOST: "redis"
  REDIS_HOST_PORT: "6379"
  PHP_MEMORY_LIMIT: "512M"
  PHP_UPLOAD_LIMIT: "10G"
